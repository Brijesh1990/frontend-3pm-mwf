<!DOCTYPE html>

    <style>
      body {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        overflow-x: hidden;
      }
      header {
        width: 100%;
        height: auto;
        padding: 20px;
        background-color: #0e9ce8;
        top: 0;
        position: sticky;
      }
      nav {
        width: 100%;
        height: auto;
        background-color: black;
      }
      nav ul {
        margin-top: 0;
      }
      nav ul li {
        display: inline-block;
        padding: 20px 25px;
      }
      nav a {
        color: white;
        font-size: 20px;
        text-decoration: none;
      }

      section {
        width: 80%;
        height: auto;
        margin: auto;
      }
      div {
        width: 100%;
        height: 100px;
        background-color: gray;
        margin: 10px;
      }
      footer {
        width: 100%;
        height: 100px;
        background-color: black;
        color: white;
        margin-top: 5%;
        text-align: center;
        font-size: 20px;
      }
