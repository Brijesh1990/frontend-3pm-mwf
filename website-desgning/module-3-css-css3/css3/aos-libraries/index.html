<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Page Title</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      type="text/css"
      media="screen"
      href="css/style.css"
    />
    <!-- font aswome -->
    <link rel="stylesheet" href="css/font-awesome.min.css" />
    <!-- animations -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
    <!-- aos stylesheet -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
    <script src="main.js"></script>
  </head>
  <body>
    <section id="content">
      <h1>AOS</h1>
      <p>Animate On Scroll Library</p>
    </section>

    <section id="content1">
      <p>Scoll Down</p>
      <p><span class="fa fa-arrow-down"></span></p>
    </section>

    <!-- aos(animation on scrolll) -->
    <section id="aos-app">
      <hr />
      <h1>Fade</h1>
      <hr />

      <!-- fade aos -->
      <div class="box1" data-aos="fade-up">fade-up</div>
      <div class="box2" data-aos="fade-down">fade-down</div>

      <div class="box1" data-aos="fade-right">fade-right</div>
      <div class="box2" data-aos="fade-left">fade-left</div>

      <div class="box1" data-aos="fade-up-right">fade-up-right</div>
      <div class="box2" data-aos="fade-up-left">fade-up-left</div>
    </section>

    <div class="clearfix"></div>

    <section id="aos-app">
      <hr />
      <h1>Flip</h1>
      <hr />

      <!-- fade aos -->
      <div class="box1" data-aos="flip-up">flip-up</div>
      <div class="box2" data-aos="flip-down">flip-down</div>

      <div class="box1" data-aos="flip-right">flip-right</div>
      <div class="box2" data-aos="flip-left">flip-left</div>
    </section>

    <div class="clearfix"></div>
    <section id="aos-app">
      <hr />
      <h1>zoom</h1>
      <hr />

      <!-- fade aos -->
      <div class="box1" data-aos="zoom-in" data-aos-duration="1000">
        zoom-in
      </div>
      <div class="box2" data-aos="zoom-in-up" data-aos-duration="1000">
        zoom-in-up
      </div>

      <div class="box1" data-aos="zoom-in-down" data-aos-duration="1000">
        zoom-in-down
      </div>
      <div class="box2" data-aos="zoom-in-left" data-aos-duration="1000">
        zoom-in-left
      </div>
    </section>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
      AOS.init();
    </script>
  </body>
</html>
